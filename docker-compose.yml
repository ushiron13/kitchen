name: kitchen

services:
  caddy:
    image: caddy:2-alpine
    container_name: kitchen-caddy
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./frontend/dist:/srv/kitchen:ro
    networks: [kitchen-net]
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kitchen-backend
    restart: unless-stopped
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      KITCHEN_API_KEY: ${KITCHEN_API_KEY}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: kitchen-agent
      DB_PATH: /data/app.db
      NAS_IMAGES_PATH: /nas/recipe_images
      PROMPTS_DIR: /app/prompts
      LOG_LEVEL: INFO
      TZ: Asia/Tokyo
      ALLOWED_ORIGINS: '["https://kitchen.local"]'
    volumes:
      - ./data:/data
      - ${NAS_MOUNT_PATH:-./nas-mount}:/nas
      - ./backend/prompts:/app/prompts:ro
    networks: [kitchen-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  scheduler:
    build:
      context: ./scheduler
      dockerfile: Dockerfile
    container_name: kitchen-scheduler
    restart: unless-stopped
    environment:
      DB_PATH: /data/app.db
      NAS_BACKUP_PATH: /nas/backups
      BACKEND_URL: http://backend:8000
      KITCHEN_API_KEY: ${KITCHEN_API_KEY}
      TZ: Asia/Tokyo
    volumes:
      - ./data:/data
      - ${NAS_MOUNT_PATH:-./nas-mount}:/nas
    networks: [kitchen-net]
    depends_on:
      backend:
        condition: service_healthy

networks:
  kitchen-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
