# 開発用オーバーライド
# 使い方: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  backend:
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/src:/app/src           # ホットリロード用
      - ./backend/prompts:/app/prompts
      - ./data:/data
      - ${NAS_MOUNT_PATH:-./nas-mount}:/nas
    environment:
      LOG_LEVEL: DEBUG
      ALLOWED_ORIGINS: "http://localhost:5173,https://kitchen.local"
